name: test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate the API
        run: go generate ./...

      - name: gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go'))" || { gofmt -l $(git ls-files '*.go'); exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -race ./...

      - name: The pinned Trivy is the one fetched
        run: sh scripts/test-fetch-trivy.sh
